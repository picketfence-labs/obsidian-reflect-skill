name: helper regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: '3.9'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 1ba7f89a8e24a00d016084a65b85ecaba051e4a7
          path: .legacy
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: bash -n scripts/find_candidates.sh scripts/domain_index.sh
      - run: bash tests/test_find_candidates_root_exclusions.sh
      - run: bash tests/test_find_candidates_wikilinks.sh
      - run: python3 -B -m unittest discover -s tests -p 'test_*.py' -v
        env:
          LEGACY_SCAN_ROOT: ${{ github.workspace }}/.legacy
      - run: python3 -B tests/benchmark_scan.py --notes 50 --attachments 500 --legacy-root .legacy
      - run: python3 -B tests/benchmark_scan.py --notes 4500 --attachments 55000
